# LE PARCOURS ROULE TOUT SEUL, ET QUELQU'UN EST PRÉVENU — lot T-2, 2026-09-23.
#
# ⚖️ PHASE 1, DÉCIDÉE PAR DOM : le test roule JUSTE APRÈS chaque déploiement en
# production, et une fois par jour.
#
# ⛔ POURQUOI PAS L'ÉVÉNEMENT DE VERCEL — C'EST MESURÉ, PAS SUPPOSÉ. Les
# déploiements partent de la CLI (`vercel ls` : les quinze derniers portent
# l'usager `zapokay`, aucun n'est déclenché par git), et GitHub ne reçoit RIEN :
# `gh api repos/Zapokay/zapokay/deployments` rend **0**. Il n'existe donc aucun
# `deployment_status` à écouter. Le déclencheur est une ÉTAPE DU RITUEL :
#
#     npx vercel --prod --yes && gh workflow run parcours.yml
#
# ⭐ ET LE FILET QUOTIDIEN EXISTE POUR DEUX PANNES QUE LA PREMIÈRE NE VOIT PAS :
#   · ce qui casse SANS qu'on déploie — une clé qui périme, un réglage Supabase
#     changé à la main, un mot de passe révoqué ;
#   · le jour où l'étape du rituel est oubliée. Un déclencheur qui dépend de la
#     mémoire d'un humain n'est pas un déclencheur.
#
# ⛔ AUCUN RETOUR EN ARRIÈRE AUTOMATIQUE, ET C'EST UNE DÉCISION DE DOM. Rouge =
# on prévient. Défaire un déploiement sain parce qu'un test a eu un hoquet
# coûterait plus cher que la panne qu'on cherche : revenir en arrière reste un
# geste humain.

name: parcours

on:
  # ⭐ CHAQUE ENVOI DE CODE, POUR LES NEUF PORTES (lot T-2b, inventaire 102). La
  # discipline cesse d'être une habitude que je peux oublier : elle devient
  # structurelle. ⛔ Aucune ne demande de secret — mesuré : `check:dates` et
  # `check:adresses` fabriquent une URL et une clé factices, `check:obligations`
  # est pure, et `next build` compile SANS `.env.local` (rc=0, 40 routes).
  push:
  # Le rituel de déploiement l'appelle ; Dom peut aussi le lancer à la main.
  workflow_dispatch:
  # 12:00 UTC = 08:00 à Montréal l'été, 07:00 l'hiver. ⚪ GitHub ne connaît que
  # l'UTC : une heure locale fixe demanderait deux crons et une bascule à
  # entretenir deux fois l'an, pour un filet dont l'heure n'a aucune importance.
  schedule:
    - cron: '0 12 * * *'

jobs:
  # ── LES NEUF PORTES ────────────────────────────────────────────────────────
  # ⛔ L'ORDRE N'EST PAS DÉCORATIF : `next build` AVANT `tsc`. Le build régénère
  # `.next/types` ; l'inverse fait juger `tsc` sur des types périmés et laisse
  # passer une route dont la signature a changé.
  portes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ① next build
        run: npm run build
      - name: ② tsc --noEmit
        run: npx tsc --noEmit
      - name: ③ next lint
        run: npm run lint
      - name: ④ check:glyphs
        run: npm run check:glyphs
      - name: ⑤ check:titres
        run: npm run check:titres
      - name: ⑥ check:obligations
        run: npm run check:obligations
      - name: ⑦ check:dates
        run: npm run check:dates
      - name: ⑧ check:adresses
        run: npm run check:adresses
      - name: ⑨ check:significant-control
        run: npm run check:significant-control
      - name: ⑩ check:inscription — la sonde
        run: npm run check:inscription

  # ── LE PARCOURS, CONTRE LE PRODUIT DÉPLOYÉ ────────────────────────────────
  # ⛔ PAS SUR `push`, ET C'EST DÉLIBÉRÉ. Un envoi de code précède le
  # déploiement : le parcours y éprouverait la version PRÉCÉDENTE, et chaque
  # envoi ajouterait un PDF à la société de test pour ne rien prouver.
  parcours:
    if: github.event_name != 'push'
    # ⛔ UN SEUL PARCOURS À LA FOIS, ET LE NOUVEAU NE TUE PAS L'ANCIEN. Chaque
    # passage écrit un PDF dans la société de test ; deux exécutions simultanées
    # généreraient deux documents pour la même exigence, et l'un périmerait
    # l'autre en plein vol — un rouge qui ne dirait rien du produit.
    # ⚪ AU NIVEAU DU TRAVAIL, PAS DU WORKFLOW : depuis T-2b les portes roulent à
    # chaque envoi, et les mettre dans la même file les ferait s'attendre sans
    # aucune raison — elles n'écrivent rien.
    concurrency:
      group: parcours
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Le navigateur
        # ⚪ Playwright 1.63 n'a AUCUN script d'installation : le navigateur ne
        # descend que sur cette commande. C'est mesuré, pas supposé.
        run: npx playwright install --with-deps chromium

      - name: Le parcours
        env:
          # ⛔ LES IDENTIFIANTS VIENNENT DES SECRETS DU DÉPÔT, jamais du dépôt.
          # `.env.test.local` n'existe pas ici ; la configuration laisse gagner
          # ce qui est déjà dans l'environnement, et c'est exactement ce cas.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # ⚪ Pas un secret : c'est l'adresse publique du produit.
          E2E_BASE_URL: https://zapokay.vercel.app
        run: npm run e2e

      - name: La trace, quand c'est rouge
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-parcours
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
