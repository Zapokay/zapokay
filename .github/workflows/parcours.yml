# LE PARCOURS ROULE TOUT SEUL, ET QUELQU'UN EST PRÉVENU — lot T-2, 2026-09-23.
#
# ⚖️ PHASE 1, DÉCIDÉE PAR DOM : le test roule JUSTE APRÈS chaque déploiement en
# production, et une fois par jour.
#
# ⛔ POURQUOI PAS L'ÉVÉNEMENT DE VERCEL — C'EST MESURÉ, PAS SUPPOSÉ. Les
# déploiements partent de la CLI (`vercel ls` : les quinze derniers portent
# l'usager `zapokay`, aucun n'est déclenché par git), et GitHub ne reçoit RIEN :
# `gh api repos/Zapokay/zapokay/deployments` rend **0**. Il n'existe donc aucun
# `deployment_status` à écouter. Le déclencheur est une ÉTAPE DU RITUEL :
#
#     npx vercel --prod --yes && gh workflow run parcours.yml
#
# ⭐ ET LE FILET QUOTIDIEN EXISTE POUR DEUX PANNES QUE LA PREMIÈRE NE VOIT PAS :
#   · ce qui casse SANS qu'on déploie — une clé qui périme, un réglage Supabase
#     changé à la main, un mot de passe révoqué ;
#   · le jour où l'étape du rituel est oubliée. Un déclencheur qui dépend de la
#     mémoire d'un humain n'est pas un déclencheur.
#
# ⛔ AUCUN RETOUR EN ARRIÈRE AUTOMATIQUE, ET C'EST UNE DÉCISION DE DOM. Rouge =
# on prévient. Défaire un déploiement sain parce qu'un test a eu un hoquet
# coûterait plus cher que la panne qu'on cherche : revenir en arrière reste un
# geste humain.

name: parcours

on:
  # ⭐ CHAQUE ENVOI DE CODE, POUR LES NEUF PORTES (lot T-2b, inventaire 102). La
  # discipline cesse d'être une habitude que je peux oublier : elle devient
  # structurelle. ⛔ Aucune ne demande de secret — mesuré : `check:dates` et
  # `check:adresses` fabriquent une URL et une clé factices, `check:obligations`
  # est pure, et `next build` compile SANS `.env.local` (rc=0, 40 routes).
  push:
  # Le rituel de déploiement l'appelle ; Dom peut aussi le lancer à la main.
  workflow_dispatch:
  # 12:00 UTC = 08:00 à Montréal l'été, 07:00 l'hiver. ⚪ GitHub ne connaît que
  # l'UTC : une heure locale fixe demanderait deux crons et une bascule à
  # entretenir deux fois l'an, pour un filet dont l'heure n'a aucune importance.
  schedule:
    - cron: '0 12 * * *'

jobs:
  # ── LES NEUF PORTES ────────────────────────────────────────────────────────
  # ⛔ L'ORDRE N'EST PAS DÉCORATIF : `next build` AVANT `tsc`. Le build régénère
  # `.next/types` ; l'inverse fait juger `tsc` sur des types périmés et laisse
  # passer une route dont la signature a changé.
  portes:
    # ⛔ LA VERSION DU SYSTÈME EST FIXÉE — W-1, 2026-09-23. `ubuntu-latest`
    # bascule sur Ubuntu 26 à partir du 19 octobre 2026, et une bascule d'OS
    # produirait un rouge qui ne dirait RIEN du produit : c'est exactement le
    # genre de rouge qui apprend à ignorer les rouges. On montera de version
    # quand on le décidera, pas quand le calendrier de GitHub le décidera.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ① next build
        run: npm run build
      - name: ② tsc --noEmit
        run: npx tsc --noEmit
      - name: ③ next lint
        run: npm run lint
      - name: ④ check:glyphs
        run: npm run check:glyphs
      - name: ⑤ check:titres
        run: npm run check:titres
      - name: ⑥ check:obligations
        run: npm run check:obligations
      - name: ⑦ check:dates
        run: npm run check:dates
      - name: ⑧ check:adresses
        run: npm run check:adresses
      - name: ⑨ check:significant-control
        run: npm run check:significant-control
      - name: ⑩ check:inscription — la sonde
        run: npm run check:inscription
      - name: ⑪ check:etats — les cinq états et leurs deux catalogues
        run: npm run check:etats
      - name: ⑫ check:documents — la portée du coffre, son en-tête, ses deux vides
        run: npm run check:documents
      - name: ⑬ check:contrastes — les gris de texte en clair, et le sombre qui ne bouge pas
        run: npm run check:contrastes

  # ── LE PARCOURS, CONTRE LE PRODUIT DÉPLOYÉ ────────────────────────────────
  # ⛔ PAS SUR `push`, ET C'EST DÉLIBÉRÉ. Un envoi de code précède le
  # déploiement : le parcours y éprouverait la version PRÉCÉDENTE — il dirait
  # donc quelque chose de vrai sur du code qui n'est pas celui qu'on envoie.
  # ⚪ L'autre moitié de l'argument est tombée avec T-4 (le parcours supprime
  # désormais ce qu'il crée) ; celle-ci tient seule.
  parcours:
    if: github.event_name != 'push'
    # ⛔ UN SEUL PARCOURS À LA FOIS, ET LE NOUVEAU NE TUE PAS L'ANCIEN. Chaque
    # passage écrit un PDF dans la société de test ; deux exécutions simultanées
    # généreraient deux documents pour la même exigence, et l'un périmerait
    # l'autre en plein vol — un rouge qui ne dirait rien du produit.
    # ⚪ AU NIVEAU DU TRAVAIL, PAS DU WORKFLOW : depuis T-2b les portes roulent à
    # chaque envoi, et les mettre dans la même file les ferait s'attendre sans
    # aucune raison — elles n'écrivent rien.
    concurrency:
      group: parcours
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Le navigateur
        # ⚪ Playwright 1.63 n'a AUCUN script d'installation : le navigateur ne
        # descend que sur cette commande. C'est mesuré, pas supposé.
        run: npx playwright install --with-deps chromium

      - name: Le parcours
        env:
          # ⛔ LES IDENTIFIANTS VIENNENT DES SECRETS DU DÉPÔT, jamais du dépôt.
          # `.env.test.local` n'existe pas ici ; la configuration laisse gagner
          # ce qui est déjà dans l'environnement, et c'est exactement ce cas.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # ⚪ Pas un secret : c'est l'adresse publique du produit.
          E2E_BASE_URL: https://zapokay.vercel.app
        run: npm run e2e

      # ⭐ SUR ÉCHEC, DOM DOIT POUVOIR **VOIR**, PAS LIRE — W-3, 2026-09-23.
      # L'artefact porte trois choses, de la plus simple à la plus complète :
      #   · `test-results/**/test-failed-1.png` — la capture, ouvrable d'un clic ;
      #   · `playwright-report/index.html` — le rapport, ouvrable d'un clic aussi,
      #     capture et pas-à-pas inclus ;
      #   · `trace.zip` — le film de la page, pour qui veut rejouer (`npx
      #     playwright show-trace`).
      # ⚪ MESURE AVANT DE « RÉPARER » : le rouge du parcours joignait DÉJÀ sa
      # trace (run 35871166530, artefact `trace-parcours`). Ce qui n'en avait
      # aucun est le rouge des PORTES (run 35877009269) — il n'y a là ni
      # navigateur ni écran, et le journal EST la preuve. Ce qu'ajoute ce lot est
      # donc le rapport HTML, et un nom qui dit où regarder.
      - name: Ce que le navigateur voyait — quand c'est rouge
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capture-et-trace-du-parcours
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn


  # ── LES DEUX ACTES, SUR LA SOCIÉTÉ JETABLE ────────────────────────────────
  # ⚖️ LOT T-8-5 : « ajouter un administrateur » et « transférer des actions »
  # sur la société créée par le parcours d'inscription — JAMAIS sur ZZ-TEST
  # Parcours, dont la preuve d'isolement exige un parc stable.
  #
  # ⛔ AU DÉPLOIEMENT SEULEMENT, PAS DANS LE FILET QUOTIDIEN — décision de Dom.
  # Ces actes NE SE DÉFONT PAS : chaque passage laisse une personne, un mandat
  # ou une détention de plus. Les passer chaque nuit ferait dériver la société
  # pour rien ; un déploiement, lui, mérite qu'on les éprouve.
  #
  # ⚠️ ET LE PARCOURS D'INSCRIPTION N'EST PAS ICI, DÉLIBÉRÉMENT : il ne se rejoue
  # pas (un compte ne s'inscrit qu'une fois), et le brancher produirait un rouge
  # « Compte ÉPUISÉ » à chaque déploiement suivant. Il se lance à la main :
  # `npm run e2e:inscription`, sur un compte NEUF.
  actes:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: actes
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Les deux actes
        env:
          E2E_INSCRIPTION_EMAIL: ${{ secrets.E2E_INSCRIPTION_EMAIL }}
          E2E_INSCRIPTION_PASSWORD: ${{ secrets.E2E_INSCRIPTION_PASSWORD }}
          E2E_BASE_URL: https://zapokay.vercel.app
        run: npm run e2e:actes
      - name: Ce que le navigateur voyait — quand c'est rouge
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capture-et-trace-des-actes
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
